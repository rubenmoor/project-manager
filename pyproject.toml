[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pm"
dynamic = ["version"]
description = "A project manager for Claude Code workers: milestones, plans and tasks in SQLite, worked by claude -p"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pm = "pm:main"

[tool.setuptools]
packages = ["pm"]

[tool.setuptools.dynamic]
version = { attr = "pm.VERSION" }

[tool.setuptools.package-data]
pm = ["project-manager.toml", "instructions.md"]
