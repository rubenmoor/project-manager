# pm configuration. A setting left out gets its default from pm's own copy of this file.

# Milestones, plans, tasks and decisions as SQL text, tracked by git; relative to the project root.
database = "tasks.sql"

# Command that works one task. "{prompt}" is replaced by the worker prompt. With claude's JSON output
# (--output-format stream-json --verbose), pm shows it readably and records model, turns, tokens and cost per run.
worker = ["claude", "-p", "{prompt}", "--permission-mode", "acceptEdits",
          "--allowedTools", "Bash Read Edit Write Glob Grep", "--output-format", "stream-json", "--verbose"]

# Minutes to wait after a usage limit resets before retrying the task.
limit_margin_minutes = 5

# Worker logs. A relative path is inside the git directory, so it is never tracked.
log_dir = "pm-logs"

# Editor for `pm milestone add`. Empty: the editor git uses.
editor = ""

# The task `pm milestone add` queues in the milestone's first plan (body "tbd.").
# {milestone_id}, {milestone_subject} and {plan_id} are replaced.
masterplan_prompt = '''
Write plan {plan_id}, the masterplan of this milestone: expand on everything that needs to be done to achieve it,
divided into parts. State in the masterplan that its own tasks are not implementation work: each of them writes the
plan for one part.
'''

# The task `pm plan add` and `pm plan edit` queue. {plan_id} and {plan_subject} are replaced.
plan_tasks_prompt = '''
Split plan {plan_id} into tasks and identify all decisions that need to be made. If the plan already has tasks,
bring them in line with the plan. A task that writes a plan gets `--kind plan`.
'''

# The task "post-milestone cleanup", queued in a milestone's first plan once all its other tasks are closed; the
# milestone is implemented when it is closed too.
cleanup_prompt = '''
* rewrite top-level .md files to reflect the current state of the project
* remove files that have become redundant
* suggest entirely new files, if necessary
* delete code that isn't actually used
* check pending decisions if they are still relevant and really pending
* check other milestones if their contents are up-to-date and update them if necessary
'''

# Priority of the planning work: the masterplan `pm milestone add` creates (its tasks write the plans) and every task
# "create tasks for plan N". Above every other plan, so all plans and their tasks exist before implementation starts.
planning_priority = 1000

# Decisions: workers create pending decisions for questions only you can answer, and the tasks that depend on them
# wait until you answer them (`pm decide`; `pm run` asks). Customize the criteria for creating pending decisions in
# your project's AGENTS.md or similar.
#
# In addition, you can force sign-off decisions; `pm run` works nothing that waits for one until you approve it.
#   "masterplans"  a masterplan, before its tasks are created
#   "plans"        every other plan, before its tasks are created
#   "task-queue"   the work tasks, once all planning is done; work tasks added later need a new sign-off
signoff = []

# Appended to every worker's prompt and to `pm instructions`. Empty: nothing.
plan_priority_prompt = '''
Before writing a plan, run `pm plan list`: the existing plans with open tasks, their ids and priorities. Don't
duplicate one of them; refer to it where the new plan depends on it.

Plan priority (higher runs first). Give every new plan (not the masterplan) the priority of what it mostly affects:

   900  database schema or equivalent
   800  public-facing API
   700  backend code or equivalent
   600  core mechanics, core functionality
   500  client-side code
   400  user interface
   300  visual design
   200  media and assets

If the new plan must clearly run before or after one of the listed plans, pick a priority that puts it there
instead, e.g. 100 above or below that plan's; stay below 1000, the priority of planning work. Set it with
`pm plan add … --priority N` or `pm plan edit <plan> --priority N`.
'''

# Appended to every worker's prompt and to `pm instructions`. Empty: nothing.
task_priority_prompt = '''
Task priority: leave it out, so the task gets its plan's priority, unless there is a good reason for it to run
earlier or later than the order you add the tasks in. Then use the plan's priority (`pm show`) plus or minus a
multiple of 10, e.g. `--priority 710` or `--priority 690` in a plan with priority 700, so priorities can be fine-tuned
later.
'''
