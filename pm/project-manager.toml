# pm configuration. A setting left out gets its default from pm's own copy of this file.

# Milestones, plans, tasks and decisions as SQL text, tracked by git; relative to the project root.
database = "tasks.sql"

# Command that works one task. The worker prompt goes to its stdin; an argument containing "{prompt}" gets it
# instead, but then the prompt is in the command line, where `pkill -f <word in the task>` matches the worker itself.
# "{settings}" is replaced by claude settings (JSON): hooks that block `pkill -f`, `killall` and `kill -1` and reading or
# grepping the database file, and that keep the worker going once if it stops with its task still open; Read (and so
# Grep) of the database denied; no background tasks (`claude -p` ends with the turn, and
# a background job with it), Bash commands up to 60 minutes in the foreground instead.
# With claude's JSON output (--output-format stream-json --verbose), pm shows it readably and records model, turns,
# tokens and cost per run.
worker = ["claude", "-p", "--settings", "{settings}", "--permission-mode", "acceptEdits",
          "--allowedTools", "Bash Read Edit Write Glob Grep", "--output-format", "stream-json", "--verbose"]

# Minutes to wait after a usage limit resets before retrying the task.
limit_margin_minutes = 5

# Worker logs. A relative path is inside the git directory, so it is never tracked.
log_dir = "pm-logs"

# Editor for `pm milestone add`. Empty: the editor git uses.
editor = ""

# In the prompts below, {milestone}, {plan} and {parent_plan} are replaced by the item's id and subject in backticks,
# e.g. `plan 12: Export endpoint`; the *_id placeholders by the bare id.

# The task `pm milestone add` queues in the milestone's first plan (body "tbd.").
# {milestone}, {plan}, {milestone_id}, {milestone_subject} and {plan_id} are replaced.
masterplan_prompt = '''
Write {plan}, the masterplan of {milestone}: expand on everything that needs to be done to achieve it,
divided into parts. State in the masterplan that its own tasks are not implementation work: each of them writes the
plan for one part.
'''

# The task `pm plan add` and `pm plan edit` queue. {plan}, {plan_id} and {plan_subject} are replaced.
plan_tasks_prompt = '''
Split {plan} into tasks and identify all decisions that need to be made. If the plan already has tasks, its
done and dropped ones stay as they are (pm refuses to change them): drop the open ones that no longer fit and add
tasks for what the plan asks beyond them. A task that writes a plan gets `--kind plan`.
'''

# The task a changed milestone queues in its masterplan (pm refuses the change once every plan of the milestone is
# done). {milestone}, {plan} and {plan_id} are replaced.
revise_masterplan_prompt = '''
{milestone} changed. Bring {plan}, the masterplan, in line with it (`pm plan edit {plan_id} --body -`), or
leave it as it is if it still fits. An edit queues the revision of the plans below it and of its own open tasks.
'''

# The task a changed plan queues in each plan below it that isn't done (a plan is done when none of its tasks is open
# and the plans below it are done). {plan}, {parent_plan}, {plan_id} and {parent_plan_id} are replaced; the parent
# plan follows.
revise_plan_prompt = '''
{parent_plan}, the plan above {plan}, changed; it is quoted below. Bring {plan} in line with it
(`pm plan edit {plan_id} --body -`), or leave it as it is if it still fits. An edit queues the revision of the plans
below it and of its own open tasks; its done and dropped tasks stay as they are.
'''

# The task "post-milestone cleanup of milestone N: …", queued in a milestone's first plan once all its other tasks are
# closed; the milestone is implemented when it is closed too. {milestone} is replaced.
cleanup_prompt = '''
After {milestone}, for the whole project:
* rewrite top-level .md files to reflect the current state of the project
* remove files that have become redundant
* suggest entirely new files, if necessary
* delete code that isn't actually used
* check pending decisions if they are still relevant and really pending
* check other milestones if their contents are up-to-date; raise a decision for each change they need
'''

# Body of the task pm queues when a task fails (kind investigate), above the failed task; the failure's summary
# follows. {task}: the failed task; {task_id}, {plan_id}; {fix_priority}: between the investigation and the failed task.
investigate_prompt = '''
{task} failed in `pm run`; its summary is below. Find out why, don't redo its work:
* read its log, `pm show {task_id}`, and the stashes it left (`git stash show -p --include-untracked <sha>`); don't apply or drop them, task {task_id}'s next run gets them
* rerun the failing command or script to see the error yourself; find the cause in the code, not only the symptom
Then, by what you find:
* a bug in a script, test, tool or config of the project: add a task that fixes it, `pm task add {plan_id} "<subject>" --priority {fix_priority}`, with the cause, where it is and how to check the fix; it runs before task {task_id} does again
* task {task_id} itself is wrong or out of date: change it (`pm task set {task_id} --body …`) or drop it (`pm task drop {task_id} "<reason>"`)
* it needs the human: `pm decision add` with what you found and the options, then `pm task-pending-decision {task_id} <decision>`
* nothing to fix (a passing outage): say so; task {task_id} runs again as it is
If earlier investigations of this task are listed below, don't repeat their fix: raise a decision instead.
Your note on `pm task done`: the cause and what you queued.
'''

# Body of the task "write an executive summary" (kind summary, no plan), queued by `pm summary request` or the
# dashboard's button at priority 10000, so it runs next. Its worker stores the summary with `pm summary add`.
summary_prompt = '''
Write an executive summary of the project for the human: where it stands, in a few minutes of reading. Look, don't
change: no code, files, tasks, plans or decisions; stage nothing.
* the previous summary: `pm summary show` (none: this is the first, cover the project so far)
* what happened since it: `git log --stat <its commit>..HEAD` (pm's commits name the tasks and decisions), `pm status`,
  `pm milestone list`, `pm runs`, `pm decision list`, `pm decision list --answered`, `pm show <id>` where it matters

Markdown, for the human, who knows the project but not the last days. Lead with:
* **Needs you**: pending decisions and sign-offs, what each blocks; failures, stalls
* **Since the last summary**: the delta: what got done, what changed course (new plans, revisions, dropped tasks,
  decisions answered or recorded by workers), runs, failures and cost
* **Where it stands**: each open milestone: progress, what comes next
* **Risks**: what may go wrong, take longer or need a decision soon

Bullets, ids with subjects (`task 12: <subject>`), no padding. Store it: `pm summary add < summary.md`, delete
summary.md, then close your task.
'''

# Priority of the planning work: the masterplan `pm milestone add` creates (its tasks write the plans) and every task
# "create tasks for plan N: …". Above every other plan, so all plans and their tasks exist before implementation starts;
# within one milestone queue index: a higher index waits, planning included.
planning_priority = 1000

# Decisions: workers create pending decisions for questions only you can answer, and the tasks that depend on them
# wait until you answer them (`pm decide`; `pm run` goes on with other tasks). Customize the criteria for creating pending decisions in
# your project's AGENTS.md or similar.
#
# In addition, you can force sign-off decisions; `pm run` works nothing that waits for one until you approve it.
#   "masterplans"  a masterplan, before its tasks are created
#   "plans"        every other plan, before its tasks are created
#   "task-queue"   the work tasks, once all planning is done; work tasks added later need a new sign-off
#   "web"          a task marked web (`pm task add --web`, `pm task set --web`), before its worker gets WebSearch and
#                  WebFetch; without "web", marked tasks get them unasked
signoff = ["web"]

# Appended to every worker's prompt and to `pm instructions`. Empty: nothing.
plan_priority_prompt = '''
Before writing a plan, run `pm plan list`: the existing plans with open tasks, their ids and priorities. Don't
duplicate one of them; refer to it where the new plan depends on it.

Plan priority (higher runs first). Give every new plan (not the masterplan) the priority of what it mostly affects:

   900  database schema or equivalent
   800  public-facing API
   700  backend code or equivalent
   600  core mechanics, core functionality
   500  client-side code
   400  user interface
   300  visual design
   200  media and assets

If the new plan must clearly run before or after one of the listed plans, pick a priority that puts it there
instead, e.g. 100 above or below that plan's; stay below 1000, the priority of planning work. Set it with
`pm plan add … --priority N` or `pm plan edit <plan> --priority N`.
'''

# Appended to every worker's prompt and to `pm instructions`. Empty: nothing.
task_priority_prompt = '''
Task priority: leave it out, so the task gets its plan's priority, unless there is a good reason for it to run
earlier or later than the order you add the tasks in. Then use the plan's priority (`pm show`) plus or minus a
multiple of 10, e.g. `--priority 710` or `--priority 690` in a plan with priority 700, so priorities can be fine-tuned
later.
'''
