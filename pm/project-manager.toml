# pm configuration. A setting left out gets its default from pm's own copy of this file.

# Milestones, plans, tasks and decisions as SQL text, tracked by git; relative to the project root.
database = "tasks.sql"

# Command that works one task. The worker prompt goes to its stdin; an argument containing "{prompt}" gets it
# instead, but then the prompt is in the command line, where `pkill -f <word in the task>` matches the worker itself.
# "{settings}" is replaced by claude settings (JSON): hooks that block `pkill -f`, `killall` and `kill -1` and reading or
# grepping the database file, and that keep the worker going once if it stops with its task still open; Read (and so
# Grep) of the database denied; no background tasks (`claude -p` ends with the turn, and
# a background job with it), Bash commands up to 60 minutes in the foreground instead.
# With claude's JSON output (--output-format stream-json --verbose), pm shows it readably and records model, turns,
# tokens and cost per run.
worker = ["claude", "-p", "--settings", "{settings}", "--permission-mode", "acceptEdits",
          "--allowedTools", "Bash Read Edit Write Glob Grep", "--output-format", "stream-json", "--verbose"]

# Minutes to wait after a usage limit resets before retrying the task.
limit_margin_minutes = 5

# Warm hand-off: a work task that follows a done work task of the same plan resumes that run's Claude session
# (`--resume`), so the worker keeps what it learned of the code; only with claude's stream-json output, and only if
# the previous run ended less than 5 minutes ago (its prompt cache is still warm). At most this many tasks in one
# session, then a fresh one; 0 or 1: every task fresh. Still one run, one commit and one cost record per task.
warm_handoff = 3

# `pm run` pushes the trunk's branch to its upstream (`git push`, never forced) at most every this many minutes, only
# while no task runs in the trunk; a failed push is retried next time. 0: never. Work tree branches aren't pushed.
push_minutes = 60

# Work trees ([worktrees] at the end): every task but the human's exec tasks and pm's planning and cleanup tasks
# (they run in the trunk, the project's own checkout) runs in one of them: <worktree_dir>/<name>, on the branch
# pm/wt/<name>, kept between tasks. Before a task pm merges the trunk into it; after the task, pm commits there and
# merges the branch into the trunk while no task runs there and nothing is staged there. Tasks of different work trees
# (and the trunk) run at the same time, at most max_parallel; 1: one task at a time.
# worktree_dir: relative to the project root, "{repo}" is the project folder's name; keep it outside the project.
max_parallel = 4
worktree_dir = "../{repo}-worktrees"

# Worker logs. A relative path is inside the git directory, so it is never tracked.
log_dir = "pm-logs"

# Editor for `pm milestone add`. Empty: the editor git uses.
editor = ""

# In the prompts below, {milestone}, {plan} and {parent_plan} are replaced by the item's id and subject in backticks,
# e.g. `plan 12: Export endpoint`; the *_id placeholders by the bare id.

# The task `pm milestone add` queues in the milestone's first plan (body "tbd.").
# {milestone}, {plan}, {milestone_id}, {milestone_subject} and {plan_id} are replaced.
masterplan_prompt = '''
Write {plan}, the masterplan of {milestone}: expand on everything that needs to be done to achieve it,
divided into parts, with an intro in plain English (`pm plan edit {plan_id} --intro "…" --body -`). State in the masterplan that its own tasks are not implementation work: each of them writes the
plan for one part.
'''

# The task `pm plan add` and `pm plan edit` queue. {plan}, {plan_id} and {plan_subject} are replaced.
plan_tasks_prompt = '''
Split {plan} into tasks and identify all decisions that need to be made. If the plan already has tasks, its
done and dropped ones stay as they are (pm refuses to change them): drop the open ones that no longer fit and add
tasks for what the plan asks beyond them. A task that writes a plan gets `--kind plan`.
'''

# The task a changed milestone queues in its masterplan (pm refuses the change once every plan of the milestone is
# done). {milestone}, {plan} and {plan_id} are replaced.
revise_masterplan_prompt = '''
{milestone} changed. Bring {plan}, the masterplan, in line with it (`pm plan edit {plan_id} --body -`), or
leave it as it is if it still fits. An edit queues the revision of the plans below it and of its own open tasks.
'''

# The task a changed plan queues in each plan below it that isn't done (a plan is done when none of its tasks is open
# and the plans below it are done). {plan}, {parent_plan}, {plan_id} and {parent_plan_id} are replaced; the parent
# plan follows.
revise_plan_prompt = '''
{parent_plan}, the plan above {plan}, changed; it is quoted below. Bring {plan} in line with it
(`pm plan edit {plan_id} --body -`), or leave it as it is if it still fits. An edit queues the revision of the plans
below it and of its own open tasks; its done and dropped tasks stay as they are.
'''

# The task "post-milestone cleanup of milestone N: …", queued in a milestone's first plan once all its other tasks are
# closed; the milestone is implemented when it is closed too. {milestone} is replaced.
cleanup_prompt = '''
After {milestone}, for the whole project:
* rewrite top-level .md files to reflect the current state of the project
* remove files that have become redundant
* suggest entirely new files, if necessary
* delete code that isn't actually used
* check pending decisions if they are still relevant and really pending
* check other milestones if their contents are up-to-date; raise a decision for each change they need
'''

# Body of the task pm queues when a task fails (kind investigate), above the failed task; the failure's summary
# follows. {task}: the failed task; {task_id}, {plan_id}; {fix_priority}: between the investigation and the failed task.
investigate_prompt = '''
{task} failed in `pm run`; its summary is below. Find out why, don't redo its work:
* read its log, `pm show {task_id}`, and the stashes it left (`git stash show -p --include-untracked <sha>`); don't apply or drop them, task {task_id}'s next run gets them
* rerun the failing command or script to see the error yourself; find the cause in the code, not only the symptom
Then, by what you find:
* a bug in a script, test, tool or config of the project: add a task that fixes it, `pm task add {plan_id} "<subject>" --priority {fix_priority}`, with the cause, where it is and how to check the fix; it runs before task {task_id} does again
* task {task_id} itself is wrong or out of date: change it (`pm task set {task_id} --body …`) or drop it (`pm task drop {task_id} "<reason>"`)
* it needs the human: `pm decision add` with what you found and the options, then `pm task-pending-decision {task_id} <decision>`
* nothing to fix (a passing outage): say so; task {task_id} runs again as it is
If earlier investigations of this task are listed below, don't repeat their fix: raise a decision instead.
Your note on `pm task done`: the cause and what you queued.
'''

# The task pm queues in a work tree when it and the trunk don't merge cleanly (kind merge, priority of the work tree's
# last task + 2); the work tree runs nothing else until it is done. {worktree}, {branch}, {trunk} (the trunk's HEAD
# then), {tasks} (the tasks on the branch the trunk doesn't have) are replaced.
merge_prompt = '''
The trunk and work tree {worktree} (this checkout, branch `{branch}`) conflict: merging one into the other fails. The
work tree holds the work of {tasks}.
* `git merge --no-commit {trunk}` (the trunk's HEAD), then resolve every conflict so both sides' intent survives;
  read the tasks involved (`pm show <id>`) and the commits (`git log -p HEAD...{trunk}`) where it isn't obvious
* run the checks the project has for the files involved
* stage the result (`git add`); pm commits the merge and merges this work tree into the trunk. Don't
  `git merge --abort`
Your note on `pm task done`: what conflicted and how you resolved it.
'''

# Body of the task "write an executive summary" (kind exec), queued by `pm summary request` or the
# dashboard's button at priority 10000. Its worker stores the summary with `pm summary add`.
summary_prompt = '''
Write an executive summary for the owner of this project: a busy person who doesn't read code, tasks or plans. Write
it for an interested outsider who knows nothing about the project: plain, good English in full sentences, no jargon.
Change nothing in the project; stage nothing.

Read first: the previous summary (`pm summary show`), the milestones (`pm milestone list`, `pm show m<id>`), and what
was done since the previous summary (`git log --stat <its commit>..HEAD`, `pm show <id>` where you need more).

Write, in this order:
1. **What the project is**, in one or two sentences: what it makes, for whom, and why. Every summary starts this way.
2. **Where it stands**, in one sentence: how far along it is toward the current goal (the open milestone), and
   whether that is on track, in terms of what the product can do.
3. **What's new** since the previous summary (for the first one: everything so far): what the product can do now
   that it couldn't before, and why that matters. Explain it to the outsider; don't go into detail.
4. **What comes next**, plus a risk only if it could change the outcome or the timing.

Leave out everything about how the work is managed: decisions, sign-offs, tasks, plans, runs, failures, cost, tests
and pm itself; never ids, file names or counts of these. One screen at most, about 250 words, few headings.
Store it: `pm summary add < summary.md`, delete summary.md, then close your task.
'''

# Body of the task "write a resource use report" (kind exec), queued by `pm report request` or the dashboard's button
# at priority 10000. Its worker stores the report with `pm report add`; pm sums each category's time, tokens and cost.
report_prompt = '''
Write a resource use report: sort every done task of this project into categories of the work itself, so the owner
sees where time and tokens went. Change nothing in the project; stage nothing.

`pm report tasks` lists the done tasks: id, kind, the commits that did the work, subject, note.

1. First pass: read every task's diff (`git show --stat <commit>`, then `git show <commit> -- . ':!{database}'`;
   skim large ones) and, where the diff doesn't tell, `pm show <id>`. Note in notes.md, one line per task: what it
   actually built or changed, and loose candidate categories. Name them in the project's own terms: what the product
   is made of and what making it takes, e.g. for a game 3D assets, question authoring, store publishing, UI,
   translations; never pm's task kinds. Planning and upkeep tasks are classified like the rest, by what they plan
   or touch.
2. Decide on a set of mutually exclusive categories that together cover every task, each with one sentence of
   criteria that decides which tasks belong in it. Start from scratch; don't look at earlier reports.
3. Second pass: apply the criteria and put every task in exactly one category; a task that spans several goes
   where most of its work went.

Store it: write report.json, `{"categories": [{"name": "…", "criteria": "…", "tasks": [3, 7]}]}`, then
`pm report add < report.json` (it refuses a report that misses a done task or has one twice), delete notes.md and
report.json, then close your task.
'''

# Body of a custom report's task "answer: …" (kind exec), queued by `pm report ask` or the dashboard's form at
# priority 10000; {question} is the owner's text. Its worker stores the answer with `pm report answer`.
custom_report_prompt = '''
The owner of this project asks:

{question}

Answer in one paragraph for a busy person who doesn't read code, tasks or plans: plain, good English in full
sentences, pleasant to read, no jargon, like an executive summary. Find out what you need first: the milestones
(`pm milestone list`, `pm show m<id>`), the code, `git log`, `pm show <id>`, the reports (`pm report list`). Leave out
how the work is managed (decisions, tasks, plans, runs, pm itself) unless the question is about it; never ids or file
names. If the question asks for something to be done, don't do it: say in the paragraph what it would take.
Change nothing in the project; stage nothing.
Store it: `pm report answer < answer.md`, delete answer.md, then close your task.
'''

# Priority of the planning work: the masterplan `pm milestone add` creates (its tasks write the plans) and every task
# "create tasks for plan N: …". Above every other plan, so all plans and their tasks exist before implementation starts;
# within one milestone queue index: a higher index waits, planning included.
planning_priority = 1000

# Decisions: workers create pending decisions for questions only you can answer, and the tasks that depend on them
# wait until you answer them (`pm decide`; `pm run` goes on with other tasks). Customize the criteria for creating pending decisions in
# your project's AGENTS.md or similar.
#
# In addition, you can force sign-off decisions; `pm run` works nothing that waits for one until you approve it.
#   "masterplans"  a masterplan, before its tasks are created
#   "plans"        every other plan, before its tasks are created
#   "task-queue"   the work tasks, once all planning is done; work tasks added later need a new sign-off
#   "web"          a task marked web (`pm task add --web`, `pm task set --web`), before its worker gets WebSearch and
#                  WebFetch; without "web", marked tasks get them unasked
signoff = ["web"]

# Appended to every worker's prompt and to `pm instructions`. Empty: nothing.
plan_priority_prompt = '''
Before writing a plan, run `pm plan list`: the existing plans with open tasks, their ids and priorities. Don't
duplicate one of them; refer to it where the new plan depends on it.

Plan priority (higher runs first). Give every new plan (not the masterplan) the priority of what it mostly affects:

   900  database schema or equivalent
   800  public-facing API
   700  backend code or equivalent
   600  core mechanics, core functionality
   500  client-side code
   400  user interface
   300  visual design
   200  media and assets

If the new plan must clearly run before or after one of the listed plans, pick a priority that puts it there
instead, e.g. 100 above or below that plan's; stay below 1000, the priority of planning work. Set it with
`pm plan add … --priority N` or `pm plan edit <plan> --priority N`.
'''

# Appended to every worker's prompt and to `pm instructions`. Empty: nothing.
task_priority_prompt = '''
Task priority: leave it out, so the task gets its plan's priority, unless there is a good reason for it to run
earlier or later than the order you add the tasks in. Then use the plan's priority (`pm show`) plus or minus a
multiple of 10, e.g. `--priority 710` or `--priority 690` in a plan with priority 700, so priorities can be fine-tuned
later.
'''

# Claude model per task kind, passed as `claude --model`. A task's own model (`pm task add|set --model`) comes first;
# then "escalate", for a task with a failed run or an investigation; then its kind; then "default". "": claude's own
# default. Only when the worker is claude and its command has no --model of its own. A warm hand-off continues a
# session only when the model stays the same. Keys left out keep pm's defaults below.
[models]
default = "sonnet"
masterplan = "opus"
plan = "opus"
split = "opus"
revise = "opus"
investigate = "opus"
escalate = "opus"

# The work trees pm's workers run in, name = what belongs there (one line; workers read it to pick one for each task
# they add). At least one; `pm task add` needs `--worktree <name>` (or `--exec`). Names: lowercase letters, digits, -.
# Example, a game with question authoring apart from the app:
#   app = "the game itself: code, UI, assets, builds"
#   questions = "question authoring: generating, quality checking, translating and reworking questions"
[worktrees]
