# pm configuration. A setting left out gets its default from pm's own copy of this file.

# Milestones, plans, tasks and decisions as SQL text, tracked by git; relative to the project root.
database = "tasks.sql"

# Command that works one task. "{prompt}" is replaced by the worker prompt.
worker = ["claude", "-p", "{prompt}", "--permission-mode", "acceptEdits",
          "--allowedTools", "Bash Read Edit Write Glob Grep"]

# Minutes to wait after a usage limit resets before retrying the task.
limit_margin_minutes = 5

# Worker logs. A relative path is inside the git directory, so it is never tracked.
log_dir = "pm-logs"

# Editor for `pm milestone add`. Empty: the editor git uses.
editor = ""

# The task `pm milestone add` queues in the milestone's first plan (body "tbd.").
# {milestone_id}, {milestone_subject} and {plan_id} are replaced.
masterplan_prompt = '''
Write plan {plan_id}, the masterplan of this milestone: expand on everything that needs to be done to achieve it,
divided into parts. State in the masterplan that its own tasks are not implementation work: each of them writes the
plan for one part.
'''

# The task `pm plan add` and `pm plan edit` queue. {plan_id} and {plan_subject} are replaced.
plan_tasks_prompt = '''
Split plan {plan_id} into tasks and identify all decisions that need to be made. If the plan already has tasks,
bring them in line with the plan.
'''

# The task "post-milestone cleanup", queued in a milestone's first plan once all its other tasks are closed; the
# milestone is implemented when it is closed too.
cleanup_prompt = '''
* rewrite top-level .md files to reflect the current state of the project
* remove files that have become redundant
* suggest entirely new files, if necessary
* delete code that isn't actually used
* check pending decisions if they are still relevant and really pending
* check other milestones if their contents are up-to-date and update them if necessary
'''
